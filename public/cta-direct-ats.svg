<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing orbs -->
    <radialGradient id="redGlow" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#FF4742" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FF4742" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="amberGlow" cx="80%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>

    <!-- Card gradients -->
    <linearGradient id="cardDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2937" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="btnGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4742" />
      <stop offset="100%" stop-color="#E03A35" />
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    
    <filter id="btnShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#FF4742" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bgGradient)" />
  <circle cx="200" cy="150" r="350" fill="url(#redGlow)" />
  <circle cx="1000" cy="500" r="400" fill="url(#amberGlow)" />

  <!-- Subtle Grid Lines -->
  <g stroke="#374151" stroke-width="1" stroke-opacity="0.15">
    <line x1="0" y1="126" x2="1200" y2="126" />
    <line x1="0" y1="252" x2="1200" y2="252" />
    <line x1="0" y1="378" x2="1200" y2="378" />
    <line x1="0" y1="504" x2="1200" y2="504" />
    <line x1="240" y1="0" x2="240" y2="630" />
    <line x1="480" y1="0" x2="480" y2="630" />
    <line x1="720" y1="0" x2="720" y2="630" />
    <line x1="960" y1="0" x2="960" y2="630" />
  </g>

  <!-- Top Bar: Logo & Badge -->
  <g transform="translate(64, 48)">
    <!-- Brand Icon -->
    <rect width="44" height="44" rx="12" fill="#FF4742" filter="url(#dropShadow)" />
    <circle cx="22" cy="22" r="10" stroke="#FFFFFF" stroke-width="2.5" fill="none" />
    <line x1="12" y1="22" x2="32" y2="22" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="22" cy="22" r="3" fill="#FFFFFF" />

    <!-- Brand Name -->
    <text x="56" y="29" class="font-sans" font-size="22" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">
      Remote Work <tspan fill="#FF4742">Daily</tspan>
    </text>

    <!-- Verified Badge -->
    <rect x="850" y="4" width="222" height="36" rx="18" fill="#064E3B" stroke="#059669" stroke-width="1.5" />
    <circle cx="870" cy="22" r="5" fill="#10B981" />
    <text x="884" y="27" class="font-sans" font-size="13" font-weight="800" fill="#34D399" letter-spacing="0.5">
      DIRECT ATS VERIFIED
    </text>
  </g>

  <!-- Main Headline Block -->
  <g transform="translate(64, 140)">
    <!-- Urgency Pill -->
    <rect width="320" height="32" rx="16" fill="#78350F" fill-opacity="0.5" stroke="#D97706" stroke-width="1" />
    <text x="16" y="21" class="font-sans" font-size="13" font-weight="700" fill="#FBBF24">
      ⚡ BEAT 500+ APPLICANTS ON LINKEDIN
    </text>

    <!-- Main Title -->
    <text x="0" y="80" class="font-sans" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="-1">
      Apply to verified remote jobs
    </text>
    <text x="0" y="132" class="font-sans" font-size="44" font-weight="900" fill="#FF4742" letter-spacing="-1">
      straight from company career portals
    </text>

    <!-- Subtitle -->
    <text x="0" y="180" class="font-sans" font-size="18" font-weight="400" fill="#9CA3AF">
      Zero recruiter spam. 100% transparent pay. Be in the first 15 applicants.
    </text>
  </g>

  <!-- Side-by-Side Comparison Mockup Cards -->
  <g transform="translate(64, 350)">
    <!-- Left Card: The Old Way (LinkedIn Ghost Jobs) -->
    <g transform="translate(0, 0)">
      <rect width="330" height="150" rx="18" fill="#18181B" stroke="#3F3F46" stroke-width="1.5" filter="url(#dropShadow)" />
      
      <!-- Card Header -->
      <circle cx="28" cy="28" r="10" fill="#7F1D1D" />
      <text x="24" y="32" class="font-sans" font-size="12" font-weight="900" fill="#F87171">✕</text>
      <text x="46" y="32" class="font-sans" font-size="14" font-weight="800" fill="#A1A1AA">Traditional Job Boards</text>

      <!-- Details -->
      <text x="24" y="68" class="font-sans" font-size="13" font-weight="500" fill="#EF4444">• 450+ applicants in 2 hours</text>
      <text x="24" y="94" class="font-sans" font-size="13" font-weight="500" fill="#EF4444">• 80% ghost or duplicate posts</text>
      <text x="24" y="120" class="font-sans" font-size="13" font-weight="500" fill="#EF4444">• Hidden salary & recruiter spam</text>
    </g>

    <!-- VS Divider -->
    <g transform="translate(345, 60)">
      <circle cx="15" cy="15" r="15" fill="#27272A" />
      <text x="7" y="19" class="font-sans" font-size="11" font-weight="900" fill="#71717A">VS</text>
    </g>

    <!-- Right Card: The New Way (Remote Work Daily Direct ATS) -->
    <g transform="translate(390, 0)">
      <rect width="360" height="150" rx="18" fill="#132E27" stroke="#059669" stroke-width="2" filter="url(#dropShadow)" />
      
      <!-- Card Header -->
      <circle cx="28" cy="28" r="10" fill="#065F46" />
      <text x="24" y="32" class="font-sans" font-size="12" font-weight="900" fill="#34D399">✓</text>
      <text x="46" y="32" class="font-sans" font-size="14" font-weight="800" fill="#6EE7B7">Remote Work Daily Pro</text>

      <!-- Details -->
      <text x="24" y="68" class="font-sans" font-size="13" font-weight="700" fill="#A7F3D0">• Direct Greenhouse, Lever & Ashby links</text>
      <text x="24" y="94" class="font-sans" font-size="13" font-weight="700" fill="#A7F3D0">• 6-Hour Early Access (Be in top 15)</text>
      <text x="24" y="120" class="font-sans" font-size="13" font-weight="700" fill="#A7F3D0">• 100% verified salary benchmarks</text>
    </g>

    <!-- Right CTA Button Box -->
    <g transform="translate(775, 10)">
      <!-- Price & Guarantee Box -->
      <rect width="295" height="130" rx="20" fill="url(#btnGradient)" filter="url(#btnShadow)" />
      
      <text x="24" y="38" class="font-sans" font-size="13" font-weight="800" fill="#FEE2E2" letter-spacing="1">
        PLANS FROM $6.99/WK
      </text>
      <text x="24" y="72" class="font-sans" font-size="22" font-weight="900" fill="#FFFFFF">
        Unlock Direct ATS →
      </text>
      <text x="24" y="104" class="font-sans" font-size="11" font-weight="600" fill="#FECACA">
        ✓ 7-Day Guarantee  ✓ Cancel Anytime
      </text>
    </g>
  </g>

  <!-- Bottom Proof Bar -->
  <g transform="translate(64, 570)">
    <circle cx="6" cy="6" r="4" fill="#10B981" />
    <text x="18" y="10" class="font-sans" font-size="13" font-weight="600" fill="#9CA3AF">
      Verified openings at <tspan fill="#FFFFFF" font-weight="700">GitLab, Supabase, Linear, Stripe, Shopify</tspan> and 4,500+ tech companies
    </text>
    <text x="890" y="10" class="font-sans" font-size="13" font-weight="700" fill="#6B7280">
      remoteworkdaily.com
    </text>
  </g>
</svg>
