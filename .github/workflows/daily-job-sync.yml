name: Automated 2-Hour Job Ingestion & Telegram Alert Pipeline

on:
  schedule:
    # Runs every 2 hours to harvest fresh remote & high-paying hybrid jobs
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      target_jobs:
        description: 'Target job count to ingest'
        required: false
        default: '5000'

jobs:
  ingest-jobs:
    name: Harvest Verified Remote & Hybrid Jobs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Multi-Stream Job Scrapers & Dispatch Telegram Alerts
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TARGET=${{ github.event.inputs.target_jobs || '5000' }}
          node scripts/sync-jobs.mjs --target=$TARGET --force

      - name: Commit & Push Updated Jobs Dataset
        run: |
          git config --local user.email "bot@remoteworkdaily.com"
          git config --local user.name "RemoteWorkDaily Ingestion Engine"
          git add data/jobs.json data/sync-state.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): automated ingestion of fresh remote jobs [skip ci]" \
                       -m "Harvested verified remote & high-paying hybrid listings from multi-source pipeline."
            git push origin main
          else
            echo "No new jobs detected to commit."
          fi
