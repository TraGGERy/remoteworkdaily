name: Automated Hourly Job Ingestion & Telegram Alert Pipeline

on:
  schedule:
    # Runs every hour so fresh jobs land on the board (and Telegram) before competitors
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      target_jobs:
        description: 'Target job count to ingest'
        required: false
        default: '5000'

# Required so the bot can push the refreshed dataset (without this, every push failed with 403
# and the committed jobs.json silently stayed stale).
permissions:
  contents: write

# Never let two ingestion runs race on data/jobs.json
concurrency:
  group: job-ingestion
  cancel-in-progress: false

jobs:
  ingest-jobs:
    name: Harvest Verified Remote & Hybrid Jobs
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Multi-Stream Job Scrapers & Dispatch Telegram Alerts
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TARGET=${{ github.event.inputs.target_jobs || '5000' }}
          node scripts/sync-jobs.mjs --target=$TARGET --force

      - name: Commit & Push Updated Jobs Dataset
        run: |
          git config --local user.email "bot@remoteworkdaily.com"
          git config --local user.name "RemoteWorkDaily Ingestion Engine"
          git add data/jobs.json data/sync-state.json
          if ! git diff --staged --quiet; then
            # No [skip ci]: Vercel must redeploy so every serverless instance serves the same fresh dataset.
            git commit -m "chore(data): automated ingestion of fresh remote jobs" \
                       -m "Harvested verified remote & high-paying hybrid listings from multi-source pipeline." \
                       -m "How to test:
          - Open https://www.remoteworkdaily.com and note the job count
          - In Telegram, tap 'Review Pending Jobs' on the latest scrape alert
          - Expected: 'Live on Website' matches the site count and 'Newest Job Posted' is within the last few hours"
            # Rebase onto any commits pushed while scraping, then push
            git pull --rebase -X theirs origin main || git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No new jobs detected to commit."
          fi
